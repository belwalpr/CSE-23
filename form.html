<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend align="center">Student Registration Form</legend>
            <br>

            <label for="">Full name:</label>
            <input type="text" name="" id="" placeholder="Enter your full name"><br><br>

            <label for="">Email:</label>
            <input type="email" name="" id="" placeholder="Enter valid email address"><br><br>

            <label for="">Password:</label>
            <input type="text" name="" id="" placeholder="Enter password"><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male"> Male
            <input type="radio" id="female" name="female" value="female"> Female
            <input type="radio" id="other" name="other" value="other"> Other
            <br><br>

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option>Select course</option>
                <option>B.tech</option>
                <option>MBA</option>
                <option>BCA</option>
                <option>MCA</option>
            </select><br></br>
                
            <label for="contact">Contact No:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter phone number"><br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" col="30" placeholder="Enter your address"></textarea><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">
    </form>

    <p style="text-align:center;"> 2025 Student Registration Portal</p>
</body>
</html>
